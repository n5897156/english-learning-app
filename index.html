<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英语学习助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        .app-container { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; position: relative; }
        
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 24px 20px; 
            text-align: center; 
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }
        .header h1 { font-size: 24px        .header h1 { f           .header h1 ta        .header h1 { font-size: 24px        .header h1 { f           .header  b        .header h1 { font-sizf0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-tab { 
            flex: 1; 
            padding: 18px 12px; 
            text-align: center; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500; 
            color: #666; 
            position: relative;
            transition: color 0.2s;
        }
        .nav-tab.active { color: #667eea; font-weight: 600; }
        .nav-tab.active::after { 
            content: ''; 
            position: absolute; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 40px; 
            height: 3px; 
            background: #667eea; 
            border-radius: 2px;
        }
        
        .content { padding: 16px; min-height: calc(100vh - 160px); }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 24px 12px; 
            text-align: center; 
            cursor: pointer; 
            border: 1px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:active { transform: scale(0.98); }
        .card-icon { font-size: 40px; margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 4px; }
        .card-subtitle { font-size: 12px; color: #999; }
        
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 500; 
            cursor: pointer; 
            width: 100%;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            transition: opacity 0.2s;
        }
        .btn-primary:active { opacity: 0.9; }
        
        .btn-secondary { 
            background: #f8f9fa; 
            color: #333; 
            border: 1px solid #e0e0e0; 
            padding: 14px 24px; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 500; 
            cursor: pointer; 
            width: 100%;
            transition: background 0.2s;
        }
        .btn-secondary:active { background: #eee; }
        
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(0,0,0,0.5); 
            display: flex; 
            align-items: flex-end; 
            z-index: 1000;
        }
        .modal-content { 
            background: white; 
            border-radius: 20px 20px 0 0; 
            padding: 24px; 
            width: 100%; 
            max-height: 85vh; 
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 20px; color: #333; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #333; }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px; 
            background: #fafafa;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { 
            outline: none; 
            border-color: #667eea; 
            background: white;
        }
        
        .material-item { 
            background: #fafafa; 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 12px; 
            cursor: pointer;
            border: 1px solid #f0f0f0;
        }
        .material-title { font-weight: 600; font-size: 16px; color: #333; margin-bottom: 4px; }
        .material-content { font-size: 14px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .material-category { 
            display: inline-block; 
            background: #e3f2fd; 
            color: #1976d2; 
            font-size: 12px; 
            padding: 4px 12px; 
            border-radius: 20px; 
            margin-top: 8px;
        }
        
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-icon { font-size: 56px; margin-bottom: 16px; }
        
        .vocab-card { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border-radius: 16px; 
            padding: 28px 24px; 
            text-align: center; 
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        .vocab-word { font-size: 32px; font-weight: 600; margin-bottom: 8px; }
        .vocab-phonetic { opacity: 0.9; font-size: 15px; margin-bottom: 10px; }
        .vocab-meaning { font-size: 17px; opacity: 0.95; }
        
        .fill-blank-question { background: #fafafa; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
        .fill-blank-question div:first-child { font-size: 16px; line-height: 1.6; color: #333; }
        
        .question-input { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px; 
            margin-top: 14px;
            text-align: center;
        }
        .question-input:focus { outline: none; border-color: #667eea; }
        
        .result-card { 
            background: #e8f5e9; 
            color: #1b5e20; 
            border-radius: 14px; 
            padding: 24px; 
            text-align: center; 
            margin-bottom: 16px;
        }
        .result-card.incorrect { background: #ffebee; color: #c62828; }
        .result-title { font-size: 20px; font-weight: 600; }
        .result-word { font-size: 28px; font-weight: 600; margin-top: 12px; }
        
        .score-display { text-align: center; padding: 30px 24px; }
        .score-title { font-size: 20px; font-weight: 600; color: #333; }
        .score-value { font-size: 56px; font-weight: 700; color: #667eea; margin-top: 20px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .delete-btn { 
            background: #ef5350; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-size: 14px; 
            cursor: pointer; 
            margin-top: 10px;
        }
        
        .search-box { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            font-size: 16px; 
            background: #fafafa; 
            margin-bottom: 16px;
        }
        .search-box:focus { outline: none; border-color: #667eea; background: white; }
        
        .flex-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .flex-row button { flex: 1; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>📚 英语学习助手</h1>
        </div>
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="navigateTo('home')">首页</div>
            <div class="nav-tab" onclick="navigateTo('materials')">资料</div>
            <div class="nav-tab" onclick="navigateTo('vocab')">词汇</div>
            <div class="nav-tab" onclick="navigateTo('review')">复习</div>
        </div>
        <div class="content">
            <div id="tab-home" class="tab-content active">
                <div class="grid">
                    <div class="card" onclick="navigateTo('materials')">
                        <div class="card-icon">📚</div>
                        <div class="card-title">学习资料</div>
                        <div class="card-subtitle" id="home-material-count">0 篇文章</div>
                    </div>
                    <div class="card" onclick="navigateTo('vocab')">
                        <div class="card-icon">📖</div>
                        <div class="card-title">词汇库</div>
                        <div class="card-subtitle" id="home-vocab-count">0 个单词</div>
                    </div>
                    <div class="card" onclick="navigateTo('review')">
                        <div class="card-icon">🔄</div>
                        <div class="card-title">今日复习</div>
                        <div class="card-subtitle" id="home-review-count">0 个待复习</div>
                    </div>
                    <div class="card" onclick="showAddMaterialModal()">
                        <div class="card-icon">➕</div>
                        <div class="card-title">添加资料</div>
                        <div class="card-subtitle">导入新内容</div>
                    </div>
                </div>
                <div class="card" style="margin-top: 16px; padding: 20px;">
                    <div style="font-weight: 600; color: #333; margin-bottom: 8px;">📝 学习小贴士</div>
                    <div style="font-size: 14px; color: #666; line-height: 1.6;">
                        {{ learningTip }}
                    </div>
                </div>
            </div>
            <div id="tab-materials" class="tab-content">
                <div class="flex-row">
                    <button class="btn-secondary" onclick="showAddMaterialModal()">+ 添加新资料</button>
                    <button class="btn-primary" onclick="syncMaterials()">🔄 同步资料</button>
                </div>
                <div id="materials-list">
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <div>暂无学习资料</div>
                        <div style="font-size: 14px; margin-top: 8px;">点击上方按钮添加</div>
                    </div>
                </div>
            </div>
            <div id="tab-vocab" class="tab-content">
                <button class="btn-secondary" style="margin-bottom: 16px;" onclick="showAddVocabModal()">+ 添加单词</button>
                <input type="text" class="search-box" placeholder="搜索单词..." id="vocab-search" onkeyup="filterVocab()">
                <div id="vocab-list">
                    <div class="empty-state">
                        <div class="empty-icon">📖</div>
                        <div>暂无单词</div>
                        <div style="font-size: 14px; margin-top: 8px;">点击上方按钮添加</div>
                    </div>
                </div>
            </div>
            <div id="tab-review" class="tab-content">
                <div id="review-content">
                    <div class="empty-state">
                        <div class="empty-icon">🔄</div>
                        <div>暂无待复习单词</div>
                        <div style="font-size: 14px; margin-top: 8px;">添加单词后会自动生成复习计划</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="add-material-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">添加学习资料</div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="material-title" placeholder="输入标题">
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="material-category">
                    <option value="文章">文章</option>
                    <option value="新闻">新闻</option>
                    <option value="对话">对话</option>
                    <option value="每日推送">每日推送</option>
                </select>
            </div>
            <div class="form-group">
                <label>内容</label>
                <textarea id="material-content" placeholder="输入英文内容..." rows="6"></textarea>
            </div>
            <button class="btn-primary" style="margin-top: 8px;" onclick="addMaterial()">添加</button>
            <button class="btn-secondary" style="margin-top: 10px;" onclick="closeModal('add-material-modal')">取消</button>
        </div>
    </div>
    
    <div id="add-vocab-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">添加单词</div>
            <div class="form-group">
                <label>英文单词</label>
                <input type="text" id="vocab-word" placeholder="输入英文单词">
            </div>
            <div class="form-group">
                <label>音标</label>
                <input type="text" id="vocab-phonetic" placeholder="输入音标（可选）">
            </div>
            <div class="form-group">
                <label>中文释义</label>
                <input type="text" id="vocab-meaning" placeholder="输入中文释义">
            </div>
            <div class="form-group">
                <label>例句</label>
                <textarea id="vocab-example" placeholder="输入例句（可选）" rows="3"></textarea>
            </div>
            <button class="btn-primary" style="margin-top: 8px;" onclick="addVocab()">添加</button>
            <button class="btn-secondary" style="margin-top: 10px;" onclick="closeModal('add-vocab-modal')">取消</button>
        </div>
    </div>
    
    <div id="material-detail-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-height: 90vh;">
            <div class="modal-title">资料详情</div>
            <div id="material-detail-content"></div>
        </div>
    </div>
    
    <script>
        let materials = [];
        let vocabList = [];
        let isPlaying = false;
        let currentMaterial = null;
        let currentReviewIndex = 0;
        let correctCount = 0;
        let reviewAnswers = [];
        
        const learningTips = [
            '每天坚持学习30分钟，效果比突击学习更好哦！',
            '学习新单词后，试着用它造一个句子吧。',
            '多听多说，语言学习需要不断练习。',
            '利用碎片时间复习，效果事半功倍。',
            '坚持每天学习，词汇量会稳步增长！'
        ];
        
        const learningTip = learningTips[Math.floor(Math.random() * learningTips.length)];
        
        function init() {
            materials = JSON.parse(localStorage.getItem('materials') || '[]');
            vocabList = JSON.parse(localStorage.getItem('vocab') || '[]');
            
            if (materials.length === 0) {
                materials = [
                    { id: 1, title: 'Daily English', content: 'The best way to learn English is to practice every day. Reading, writing, listening, and speaking are all important skills. Consistent practice will help you improve quickly.', category: '文章', createdAt: new Date().toISOString() },
                    { id: 2, title: 'Learning Tips', content: 'Vocabulary is the foundation of language learning. Try to learn 5-10 new words every day. Use flashcards or apps to help memorize them effectively.', category: '文章', createdAt: new Date().toISOString() }
                ];
                localStorage.setItem('materials', JSON.stringify(materials));
            }
            
            if (vocabList.length === 0) {
                vocabList = [
                    { id: 1, word: 'practice', phonetic: '/ˈpræktɪs/', meaning: '练习，实践', example: 'Practice makes perfect.', reviewLevel: 1, nextReview: new Date().toISOString() },
                    { id: 2, word: 'consistent', phonetic: '/kənˈsɪstən/', meaning: '一致的，持续的', example: 'Be consistent in your learning.', reviewLevel: 1, nextReview: new Date().toISOString() },
                    { id: 3, word: 'improve', phonetic: '/ɪmˈpruːv/', meaning: '改善，提高', example: 'You will improve with practice.', reviewLevel: 1, nextReview: new Date().toISOString() },
                    { id: 4, word: 'vocabulary', phonetic: '/vəˈkæbjələri/', meaning: '词汇', example: 'Build your vocabulary every day.', reviewLevel: 1, nextReview: new Date().toISOString() },
                    { id: 5, word: 'foundation', phonetic: '/faʊnˈdeɪʃn/', meaning: '基础，根基', example: 'Vocabulary is the foundation of language.', reviewLevel: 1, nextReview: new Date().toISOString() }
                ];
                localStorage.setItem('vocab', JSON.stringify(vocabList));
            }
            
            updateHomeCounts();
            renderMaterials();
            renderVocab();
        }
        
        function navigateTo(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            const index = ['home', 'materials', 'vocab', 'review'].indexOf(tab) + 1;
            document.querySelector('.nav-tab:nth-child(' + index + ')').classList.add('active');
            document.getElementById('tab-' + tab).style.display = 'block';
            
            if (tab === 'review') renderReview();
        }
        
        function updateHomeCounts() {
            document.getElementById('home-material-count').textContent = materials.length + ' 篇文章';
            document.getElementById('home-vocab-count').textContent = vocabList.length + ' 个单词';
            const reviewCount = vocabList.filter(v => new Date(v.nextReview) <= new Date()).length;
            document.getElementById('home-review-count').textContent = reviewCount + ' 个待复习';
        }
        
        function showAddMaterialModal() {
            document.getElementById('add-material-modal').style.display = 'flex';
        }
        
        function showAddVocabModal() {
            document.getElementById('add-vocab-modal').style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        function addMaterial() {
            const title = document.getElementById('material-title').value.trim();
            const category = document.getElementById('material-category').value;
            const content = document.getElementById('material-content').value.trim();
            
            if (!title || !content) { alert('请填写标题和内容'); return; }
            
            materials.push({ id: Date.now(), title, category, content, createdAt: new Date().toISOString() });
            localStorage.setItem('materials', JSON.stringify(materials));
            closeModal('add-material-modal');
            renderMaterials();
            updateHomeCounts();
            alert('添加成功！');
            
            document.getElementById('material-title').value = '';
            document.getElementById('material-content').value = '';
        }
        
        function addVocab() {
            const word = document.getElementById('vocab-word').value.trim();
            const phonetic = document.getElementById('vocab-phonetic').value.trim();
            const meaning = document.getElementById('vocab-meaning').value.trim();
            const example = document.getElementById('vocab-example').value.trim();
            
            if (!word || !meaning) { alert('请填写单词和释义'); return; }
            
            vocabList.push({ id: Date.now(), word, phonetic, meaning, example, reviewLevel: 1, nextReview: new Date().toISOString() });
            localStorage.setItem('vocab', JSON.stringify(vocabList));
            closeModal('add-vocab-modal');
            renderVocab();
            updateHomeCounts();
            alert('添加成功！');
            
            document.getElementById('vocab-word').value = '';
            document.getElementById('vocab-phonetic').value = '';
            document.getElementById('vocab-meaning').value = '';
            document.getElementById('vocab-example').value = '';
        }
        
        function renderMaterials() {
            const list = document.getElementById('materials-list');
            if (materials.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div>暂无学习资料</div><div style="font-size: 14px; margin-top: 8px;">点击上方按钮添加</div></div>';
                return;
            }
            list.innerHTML = materials.map(m => 
                '<div class="material-item" onclick="showMaterialDetail(' + m.id + ')">' +
                    '<div class="material-title">' + m.title + '</div>' +
                    '<div class="material-content">' + m.content + '</div>' +
                    '<div class="material-category">' + m.category + '</div>' +
                '</div>'
            ).join('');
        }
        
        function renderVocab() {
            const list = document.getElementById('vocab-list');
            if (vocabList.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">📖</div><div>暂无单词</div><div style="font-size: 14px; margin-top: 8px;">点击上方按钮添加</div></div>';
                return;
            }
            list.innerHTML = vocabList.map(v => 
                '<div class="material-item">' +
                    '<div style="font-weight: 600; font-size: 17px;">' + v.word + '</div>' +
                    (v.phonetic ? '<div style="color: #999; font-size: 14px;">' + v.phonetic + '</div>' : '') +
                    '<div style="margin-top: 6px; color: #333;">' + v.meaning + '</div>' +
                    (v.example ? '<div style="margin-top: 6px; font-style: italic; font-size: 14px; color: #999;">例：' + v.example + '</div>' : '') +
                    '<button class="delete-btn" onclick="deleteVocab(' + v.id + ')">删除</button>' +
                '</div>'
            ).join('');
        }
        
        function filterVocab() {
            const search = document.getElementById('vocab-search').value.toLowerCase();
            const filtered = vocabList.filter(v => 
                v.word.toLowerCase().includes(search) || v.meaning.includes(search)
            );
            const list = document.getElementById('vocab-list');
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div>未找到匹配的单词</div></div>';
                return;
            }
            
            list.innerHTML = filtered.map(v => 
                '<div class="material-item">' +
                    '<div style="font-weight: 600; font-size: 17px;">' + v.word + '</div>' +
                    (v.phonetic ? '<div style="color: #999; font-size: 14px;">' + v.phonetic + '</div>' : '') +
                    '<div style="margin-top: 6px; color: #333;">' + v.meaning + '</div>' +
                    (v.example ? '<div style="margin-top: 6px; font-style: italic; font-size: 14px; color: #999;">例：' + v.example + '</div>' : '') +
                    '<button class="delete-btn" onclick="deleteVocab(' + v.id + ')">删除</button>' +
                '</div>'
            ).join('');
        }
        
        function deleteVocab(id) {
            if (confirm('确定要删除这个单词吗？')) {
                vocabList = vocabList.filter(v => v.id !== id);
                localStorage.setItem('vocab', JSON.stringify(vocabList));
                renderVocab();
                updateHomeCounts();
            }
        }
        
        function showMaterialDetail(id) {
            currentMaterial = materials.find(m => m.id === id);
            if (!currentMaterial) return;
            
            document.getElementById('material-detail-content').innerHTML = 
                '<div style="margin-bottom: 20px;">' +
                    '<div style="font-weight: 600; font-size: 18px; margin-bottom: 8px;">' + currentMaterial.title + '</div>' +
                    '<span class="material-category">' + currentMaterial.category + '</span>' +
                    '<div style="margin-top: 16px; line-height: 1.7; color: #333; white-space: pre-wrap;">' + currentMaterial.content + '</div>' +
                '</div>' +
                '<button class="btn-primary" style="margin-bottom: 12px;" onclick="toggleAudio()">🔊 播放语音</button>' +
                '<button class="btn-secondary" style="margin-bottom: 12px;" onclick="startFillBlank()">📝 填空练习</button>' +
                '<button class="btn-secondary" onclick="closeModal(\'material-detail-modal\')">返回</button>';
            document.getElementById('material-detail-modal').style.display = 'flex';
        }
        
        function toggleAudio() {
            if (!currentMaterial) return;
            
            if ('speechSynthesis' in window) {
                if (isPlaying) {
                    window.speechSynthesis.cancel();
                    isPlaying = false;
                } else {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(currentMaterial.content);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.9;
                    utterance.onend = () => { isPlaying = false; };
                    utterance.onerror = () => { isPlaying = false; alert('语音播放失败'); };
                    window.speechSynthesis.speak(utterance);
                    isPlaying = true;
                }
            } else {
                alert('您的浏览器不支持语音功能');
            }
        }
        
        function startFillBlank() {
            if (!currentMaterial) return;
            
            const content = currentMaterial.content;
            const sentences = content.split(/[.!?]+/).filter(s => s.trim().length > 10);
            if (sentences.length === 0) { alert('内容太短'); return; }
            
            const sentence = sentences[Math.floor(Math.random() * sentences.length)].trim();
            const words = sentence.split(' ').filter(w => w.length > 3);
            if (words.length < 3) { alert('单词太少'); return; }
            
            const blankIndex = Math.floor(Math.random() * words.length);
            const answer = words[blankIndex];
            words[blankIndex] = '____';
            
            document.getElementById('material-detail-content').innerHTML = 
                '<div style="margin-bottom: 20px;">' +
                    '<div style="font-weight: 600; margin-bottom: 16px;">填空练习</div>' +
                    '<div class="fill-blank-question">' +
                        '<div>' + words.join(' ') + '</div>' +
                        '<input type="text" class="question-input" placeholder="输入缺失的单词..." id="fill-blank-input">' +
                    '</div>' +
                '</div>' +
                '<button class="btn-primary" onclick="checkFillBlankAnswer(\'' + answer + '\')">确认答案</button>' +
                '<button class="btn-secondary" style="margin-top: 12px;" onclick="showMaterialDetail(' + currentMaterial.id + ')">返回</button>';
        }
        
        function checkFillBlankAnswer(correctAnswer) {
            const userAnswer = document.getElementById('fill-blank-input').value.toLowerCase().trim();
            const isCorrect = userAnswer === correctAnswer.toLowerCase();
            
            document.getElementById('material-detail-content').innerHTML = 
                '<div class="result-card ' + (isCorrect ? '' : 'incorrect') + '">' +
                    '<div class="result-title">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误') + '</div>' +
                    '<div class="result-word">' + correctAnswer + '</div>' +
                '</div>' +
                '<button class="btn-primary" onclick="closeModal(\'material-detail-modal\')">' + (isCorrect ? '完成练习' : '再试一次') + '</button>';
        }
        
        function renderReview() {
            const reviewQueue = vocabList.filter(v => new Date(v.nextReview) <= new Date());
            
            if (reviewQueue.length === 0) {
                document.getElementById('review-content').innerHTML = '<div class="empty-state"><div class="empty-icon">🔄</div><div>暂无待复习单词</div><div style="font-size: 14px; margin-top: 8px;">添加单词后会自动生成复习计划</div></div>';
                return;
            }
            
            currentReviewIndex = 0;
            correctCount = 0;
            reviewAnswers = [];
            showReviewWord(reviewQueue[currentReviewIndex]);
        }
        
        function showReviewWord(vocab) {
            document.getElementById('review-content').innerHTML = 
                '<div class="vocab-card">' +
                    '<div style="font-size: 14px; opacity: 0.8; margin-bottom: 8px;">请写出对应的英文单词</div>' +
                    '<div style="font-size: 28px; font-weight: 600;">' + vocab.meaning + '</div>' +
                '</div>' +
                '<input type="text" class="question-input" placeholder="输入单词..." id="review-input" onkeyup="(e) => e.key === \'Enter\' && checkReviewAnswer()">' +
                '<button class="btn-primary" style="margin-top: 12px;" onclick="checkReviewAnswer()">确认</button>' +
                '<div style="text-align: center; margin-top: 16px; color: #999; font-size: 14px;">进度: ' + (currentReviewIndex + 1) + ' / ' + vocabList.filter(v => new Date(v.nextReview) <= new Date()).length + '</div>';
        }
        
        function checkReviewAnswer() {
            const reviewQueue = vocabList.filter(v => new Date(v.nextReview) <= new Date());
            const userAnswer = document.getElementById('review-input').value.toLowerCase().trim();
            const correctAnswer = reviewQueue[currentReviewIndex].word.toLowerCase();
            const isCorrect = userAnswer === correctAnswer;
            
            if (isCorrect) correctCount++;
            
            const vocabIndex = vocabList.findIndex(v => v.id === reviewQueue[currentReviewIndex].id);
            if (vocabIndex !== -1) {
                vocabList[vocabIndex].reviewLevel = isCorrect ? vocabList[vocabIndex].reviewLevel + 1 : 1;
                const days = getNextReviewDays(vocabList[vocabIndex].reviewLevel);
                vocabList[vocabIndex].nextReview = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
                localStorage.setItem('vocab', JSON.stringify(vocabList));
            }
            
            document.getElementById('review-content').innerHTML = 
                '<div class="result-card ' + (isCorrect ? '' : 'incorrect') + '">' +
                    '<div class="result-title">' + (isCorrect ? '✓ 回答正确！' : '✗ 回答错误') + '</div>' +
                    '<div class="result-word">' + reviewQueue[currentReviewIndex].word + '</div>' +
                    (reviewQueue[currentReviewIndex].phonetic ? '<div style="margin-top: 8px;">' + reviewQueue[currentReviewIndex].phonetic + '</div>' : '') +
                '</div>' +
                '<button class="btn-primary" onclick="nextReviewWord()">' + (currentReviewIndex + 1 >= reviewQueue.length ? '完成复习' : '下一个') + '</button>';
        }
        
        function nextReviewWord() {
            const reviewQueue = vocabList.filter(v => new Date(v.nextReview) <= new Date());
            currentReviewIndex++;
            
            if (currentReviewIndex >= reviewQueue.length) {
                showReviewResult();
            } else {
                showReviewWord(reviewQueue[currentReviewIndex]);
            }
        }
        
        function showReviewResult() {
            const total = vocabList.filter(v => new Date(v.nextReview) <= new Date()).length;
            const percent = Math.round((correctCount / total) * 100);
            
            document.getElementById('review-content').innerHTML = 
                '<div class="score-display">' +
                    '<div class="score-title">复习完成！</div>' +
                    '<div class="score-value">' + correctCount + ' / ' + total + '</div>' +
                    '<div style="margin-top: 8px; font-size: 16px;">正确率: ' + percent + '%</div>' +
                '</div>' +
                '<button class="btn-primary" onclick="renderReview()">再复习一次</button>';
        }
        
        function getNextReviewDays(level) {
            const days = [1, 2, 4, 7, 14, 28];
            return days[Math.min(level - 1, days.length - 1)] || 28;
        }
        
        async function syncMaterials() {
            const pending = [{ title: 'Daily English ' + new Date().toLocaleDateString(), content: 'The best way to learn English is consistent practice. Every day spend at least 30 minutes reading, listening, or speaking. You will see improvement over time.', category: '每日推送' }];
            
            if (pending.length === 0) { alert('暂无新资料'); return; }
            
            if (confirm('发现 ' + pending.length + ' 条新资料，是否同步？')) {
                let added = 0;
                pending.forEach(remote => {
                    if (!materials.some(m => m.title === remote.title)) {
                        materials.push({ id: Date.now(), ...remote, createdAt: new Date().toISOString() });
                        added++;
                    }
                });
                localStorage.setItem('materials', JSON.stringify(materials));
                alert('成功同步 ' + added + ' 条新资料！');
                renderMaterials();
                updateHomeCounts();
            }
        }
        
        init();
    </script>
</body>
</html>
